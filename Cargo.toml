[workspace]
resolver = "2"
members = [
  "enclave-runner",
  "tokio",
  "tokio-macros",
  "tokio-test",
  "tokio-stream",
  "tokio-util",

  # Internal
  "benches",
  "examples",
  "stress-test",
  "tests-build",
  "tests-integration",
]

[workspace.metadata.spellcheck]
config = "spellcheck.toml"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(fuzzing)',
  'cfg(loom)',
  'cfg(mio_unsupported_force_poll_poll)',
  'cfg(tokio_allow_from_blocking_fd)',
  'cfg(tokio_internal_mt_counters)',
  'cfg(tokio_no_parking_lot)',
  'cfg(tokio_no_tuning_tests)',
  'cfg(tokio_taskdump)',
  'cfg(tokio_unstable)',
] }

[patch.crates-io]
async-usercalls = { git = "https://github.com/fortanix/rust-sgx.git", branch = "master" }
enclave-runner = { git = "https://github.com/fortanix/rust-sgx", branch = "master" }
mio = { git = "https://github.com/fortanix/mio", branch = "v0.8.10" }
sgx-isa = { git = "https://github.com/fortanix/rust-sgx", branch = "master" }
sgxs = { git = "https://github.com/fortanix/rust-sgx", branch = "master" }
tokio = { path = "./tokio" }
